name: Build signed CamTimer Release APK

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate release signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.CAMTIMER_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.CAMTIMER_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CAMTIMER_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.CAMTIMER_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::Configure the four CAMTIMER signing secrets in repository settings."
            exit 1
          fi
      - name: Restore private signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.CAMTIMER_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/camtimer-release.jks"
          test -s "$RUNNER_TEMP/camtimer-release.jks"
      - name: Build signed release APK
        env:
          CAMTIMER_KEYSTORE_PATH: ${{ runner.temp }}/camtimer-release.jks
          CAMTIMER_KEYSTORE_PASSWORD: ${{ secrets.CAMTIMER_KEYSTORE_PASSWORD }}
          CAMTIMER_KEY_ALIAS: ${{ secrets.CAMTIMER_KEY_ALIAS }}
          CAMTIMER_KEY_PASSWORD: ${{ secrets.CAMTIMER_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: CamTimer-release-signed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/camtimer-release.jks"
