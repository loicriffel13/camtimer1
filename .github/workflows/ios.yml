name: Build CamTimer iOS Simulator

on:
  push:
    branches: [feature/ios-camtimer]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: |
          cd ios
          xcodegen generate
      - name: Build iOS Simulator (no Apple signing required)
        run: |
          xcodebuild -project ios/CamTimer.xcodeproj -scheme CamTimer -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
