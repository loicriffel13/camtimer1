name: CamTimer iOS source checks

on:
  push:
    branches: [feature/ios-camtimer]
  workflow_dispatch:

jobs:
  inspect-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Verify iOS port structure
        run: |
          test -f ios/README.md
          echo "iOS port scaffold present. No IPA is produced yet."
